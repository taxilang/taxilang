# There's no gitlab hosted macos runners, so we can't build these automatically.
# Due to be resolved in this epic:
# https://gitlab.com/groups/gitlab-org/-/epics/8267
# ETA 20 March 2025
# Note - this code has not been tested.
build-ts-codegen-tools-macos:
   stage: build
   tags:
      - saas-macos-medium-m1
   image: macos-14-xcode-15
   script:
      # Install Maven if not present
      - if ! command -v mvn &> /dev/null; then brew install maven; fi

      # Install GraalVM via Homebrew
      - brew install --cask graalvm-jdk

      # Set up environment variables dynamically
      #- export GRAALVM_HOME=$(/usr/libexec/java_home -v 22)
      #- export PATH="$GRAALVM_HOME/bin:$PATH"
      - export PATH="/Library/Java/JavaVirtualMachines/graalvm-23.jdk/Contents/Home/bin:$PATH"
      - export GRAALVM_HOME="/Library/Java/JavaVirtualMachines/graalvm-23.jdk/Contents/Home"
      - echo "Using GraalVM from $GRAALVM_HOME"
      - ls -l $GRAALVM_HOME/bin | grep gu || echo "gu binary not found"
      - ls -l /Library/Java/JavaVirtualMachines
      - ls -l $GRAALVM_HOME/bin
      - echo "final path $PATH"
      - echo "Java version:" && java -version

      - "$GRAALVM_HOME/bin/gu install native-image"

      # Install Native Image Tool
#      - gu install native-image

      # Build native image (don't run tests)
      - mvn package -pl taxiql-codegen/taxiql-codegen-cli -am -Pnative -DskipTests
      - mkdir taxiql-codegen/taxiql-codegen-cli/target
      - cp taxiql-codegen/taxiql-codegen-cli/target/taxiql-codegen-cli taxiql-codegen/taxiql-codegen-cli/target/macos/taxiql-codegen-cli
   artifacts:
      paths:
         - 'taxiql-codegen/taxiql-codegen-cli/target/macos/taxiql-codegen-cli'
