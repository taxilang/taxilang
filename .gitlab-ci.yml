build-ts-codegen-tools-macos:
   stage: build
   only:
      - tags
      - master
      - develop
   tags:
      - saas-macos-medium-m1
   image: macos-14-xcode-15
   script:
      # First install sdkman to get other tools
      - curl -s "https://get.sdkman.io" | bash
      - source "$HOME/.sdkman/bin/sdkman-init.sh"
      - sdk version

      # Now install GraalVM and Maven:
      - sdk install java 23.0.2-graal
      - sdk install maven
      # Build native image (don't run tests)
      - mvn package -pl taxiql-codegen/taxiql-codegen-cli -am -Pnative -DskipTests
      - mkdir taxiql-codegen/taxiql-codegen-cli/target/macos
      - cp taxiql-codegen/taxiql-codegen-cli/target/taxiql-codegen-cli taxiql-codegen/taxiql-codegen-cli/target/macos/taxiql-codegen-cli
   artifacts:
      paths:
         - 'taxiql-codegen/taxiql-codegen-cli/target/macos/taxiql-codegen-cli'

.npm-install-sync-pom: &npm-install-sync-pom
   - cd sync-pom-version
   - npm i
   - npm i -g .
   ## Go back from whence we came
   - cd ..

.npm-set-version-and-publish: &npm-set-version-and-publish
   - sync-pom-version -b $CI_PIPELINE_IID
   - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
   - npm publish

