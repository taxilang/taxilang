## Manual jobs to trigger a release and increment the version (major,minor,patch)
release-major:
   variables:
      GIT_STRATEGY: none
   stage: trigger-release
   script:
      - *git_setup
      - 'mvn gitflow:release -B -DversionDigitToIncrement=$MAJOR_RELEASE_DIGIT -DskipTestProject=true'
   only:
      - develop
   when: manual

release-minor:
#   variables:
   #      GIT_STRATEGY: none
   stage: trigger-release
   script:
      - *git_setup
      - 'mvn gitflow:release -B -DversionDigitToIncrement=$MINOR_RELEASE_DIGIT  -DskipTestProject=true'
   only:
      - develop
   when: manual

release-patch:
   variables:
      GIT_STRATEGY: none
   stage: trigger-release
   script:
      - *git_setup
      - 'mvn gitflow:release -B -DversionDigitToIncrement=$PATCH_RELEASE_DIGIT  -DskipTestProject=true -P orbital-repo'
   only:
      - develop
   when: manual

## Publishing tasks (snapshots and releases)
publish-snapshot-jars:
   stage: build
   script:
      #      Need gpg for maven signing
      #      - 'apk add gnupg'
      #      - gpg -v --import <(echo "$GPG_PRIVATE_KEY")
      - 'mvn $MAVEN_CLI_OPTS deploy -P snapshot-release,orbital-repo -Daws.region=eu-west-2'
      # Check for changes to stdlib.mdx and commit them back
      - *git_setup
      - |
        STDLIB_FILE="docs2.0/src/pages/docs/language/stdlib.mdx"
        if git status --porcelain | grep -q "$STDLIB_FILE" || git diff --cached --name-only | grep -q "$STDLIB_FILE"; then
          echo "Changes detected in stdlib.mdx, committing back to repository"
          git add "$STDLIB_FILE"
          git commit -m "chore(docs): update stdlib.mdx from build process [skip ci]"
          git push origin HEAD:${CI_COMMIT_REF_NAME}
        else
          echo "No changes detected in stdlib.mdx"
        fi
   services:
      -  name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:20.10.23-dind
         alias: docker
         command: [ "--tls=false" ]
   variables:
      # Instruct Testcontainers to use the daemon of DinD.
      DOCKER_HOST: "tcp://docker:2375"
      # Instruct Docker not to start over TLS.
      DOCKER_TLS_CERTDIR: ""
      # Improve performance with overlayfs.
      DOCKER_DRIVER: overlay2
   only:
      - develop
   artifacts:
      paths:
         - "taxi-cli/target/*.zip"
         - 'language-server/taxi-lang-server-standalone/target/taxi-lang-server-jar-with-dependencies.jar'

build-plugin-beta:
   stage: build-tools
   script:
      - *setup-nvm
      - *prepare-vscode-plugin-build
      - 'npm run vsce:package'
   only:
      - develop
   after_script:
      - *cleanup-after-vscode-plugin-build
   artifacts:
      paths:
         - 'language-server/vscode-extension/*.vsix'

build-intellij-plugin:
   stage: build
   script:
      # First build required Maven dependencies
      - 'mvn clean install -pl :taxi-lang-service -am -DskipTests'
      # Now build IntelliJ plugin
      - 'cd language-server/intellij-plugin'
      - './gradlew buildPlugin --no-daemon'
   except:
      - tags
      - master
   artifacts:
      paths:
         - 'language-server/intellij-plugin/build/distributions/*.zip'
      expire_in: 30 days

publish-release:
   stage: deploy
   script:
      # Don't run tests on master, as already passed on develop
      # Use -DskipTests, but not -Dmaven.test.skip=true as we need to compile the tests (as other projects have test dependencies), but not run them.
      - 'mvn $MAVEN_CLI_OPTS -DskipTests deploy -P release,orbital-repo -Daws.region=eu-west-2'
      # Use jreleaser to publish to sdkman, and others
      - 'cd taxi-cli'
      - 'mvn deploy -P orbital-repo,sdkman -Daws.region=eu-west-2'
   only:
      - master
   artifacts:
      paths:
         - "taxi-cli/target/*.zip"
         - 'language-server/taxi-lang-server-standalone/target/taxi-lang-server-jar-with-dependencies.jar'
         - "taxi-cli/target/jreleaser/*.log"

publish-plugin:
   stage: deploy-plugin
   script:
      - *setup-nvm
      - *prepare-vscode-plugin-build
      - 'npm run vsce:publish'
   only:
      - master
   artifacts:
      paths:
         - 'language-server/vscode-extension/*.vsix'
   after_script:
      - *cleanup-after-vscode-plugin-build

publish-intellij-plugin:
   stage: deploy-plugin
   script:
      # First build required Maven dependencies
      - 'mvn clean install -pl :taxi-lang-service -am -DskipTests'
      # Now build and publish IntelliJ plugin
      - 'cd language-server/intellij-plugin'
      - './gradlew publishPlugin --no-daemon'
   only:
      - tags
   environment:
      name: jetbrains-marketplace
   artifacts:
      paths:
         - 'language-server/intellij-plugin/build/distributions/*.zip'
      expire_in: 90 days

# TypeScript build & release jobs
.setup-nx: &setup-nx
   - 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash'
   - 'export NVM_DIR="$HOME/.nvm"'
   - 'unset NPM_CONFIG_PREFIX'
   - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm'
   - 'nvm install 20'
   - 'nvm use 20'
   - 'npm install -g nx'
   - cd typescript/taxiql-client
   - npm link
   - cd ../taxiql-codegen
   - npm link @orbitalhq/taxiql-client
   - cd ../..
   - 'npm ci'

build-typescript:
   stage: build
   image: node:22
   script:
      - *setup-nx
      - npx nx build taxiql-client
      - npx nx build taxiql-codegen
   cache:
      key: ${CI_COMMIT_REF_SLUG}-typescript
      paths:
         - node_modules/
         - .nx/cache
   artifacts:
      paths:
         - typescript/taxiql-client/dist
         - typescript/taxiql-codegen/dist

# Release jobs triggered by tags
release-taxiql-client:
   stage: typescript-release
   image: node:22
   script:
      - *setup-nx
      - cd typescript/taxiql-client
      - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - npx nx build taxiql-client
      - npm publish
   cache:
      key: ${CI_COMMIT_REF_SLUG}-typescript
      paths:
         - node_modules/
         - .nx/cache
   rules:
      - if: $CI_COMMIT_TAG =~ /^ts-client-v.*$/
        when: always

release-taxiql-codegen:
   stage: typescript-release
   image: node:22
   script:
      - *setup-nx
      - cd typescript/taxiql-codegen
      - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - npx nx build taxiql-codegen
      - npm publish
   cache:
      key: ${CI_COMMIT_REF_SLUG}-typescript
      paths:
         - node_modules/
         - .nx/cache
   rules:
      - if: $CI_COMMIT_TAG =~ /^ts-codegen-v.*$/
        when: always


