variables:
   # This will supress any download for dependencies and plugins or upload messages which would clutter the console log.
   # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
   MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
   # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
   # when running from the command line.
   # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
   MAVEN_CLI_OPTS: "-s mvn-settings.xml --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -Dsdkman.consumer.key=${SDKMAN_CONSUMER_KEY} -Dsdkman.consumer.token=${SDKMAN_CONSUMER_TOKEN} -P orbital-repo -DskipTests"
   # Used during gitflow interaction.
   MAJOR_RELEASE_DIGIT: 0
   MINOR_RELEASE_DIGIT: 1
   PATCH_RELEASE_DIGIT: 2

.git_template: &git_setup |
   git remote set-url --push origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
   git config user.name "taxi-cd"
   git config user.email taxi-cd@vyne.co

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_REF_NAME"'
cache:
   paths:
      - .m2/repository

default:
   tags:
      - private-docker
   image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/maven:3.9.9-eclipse-temurin-21

.setup-nvm: &setup-nvm
   - 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash'
   - 'export NVM_DIR="$HOME/.nvm"'
   - 'unset NPM_CONFIG_PREFIX'
   - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm'
   - 'nvm install 16'
   - 'nvm use 16'

.prepare-vscode-plugin-build: &prepare-vscode-plugin-build
   - 'cd language-server/vscode-extension'
   - 'npm install'
   - 'npm run sync-pom-version'

.cleanup-after-vscode-plugin-build: &cleanup-after-vscode-plugin-build
   #   These files are modified during the build process, as we update their versions dynamically.
   #   Currently, we don't commit the changes, although we could add that at a later date
   - 'cd language-server/vscode-extension'
   - 'git restore package.json package-lock.json'

stages:
   - build
   - build-tools
   - trigger-release
   - deploy
   - deploy-plugin


# This will only validate and compile stuff and run e.g. maven-enforcer-plugin.
# Because some enforcer rules might check dependency convergence and class duplications
# we use `test-compile` here instead of `validate`, so the correct classpath is picked up.
validate:
   stage: build
   except:
      - tags
      - master
      - develop
   script:
      # Don't run tests while experimenting with native builds.
      # If this got merged to develop, that was a mistake!
      - 'mvn $MAVEN_CLI_OPTS clean verify'
   services:
      -  name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:20.10.23-dind
         alias: docker
         command: [ "--tls=false" ]
   variables:
      # Instruct Testcontainers to use the daemon of DinD.
      DOCKER_HOST: "tcp://docker:2375"
      # Instruct Docker not to start over TLS.
      DOCKER_TLS_CERTDIR: ""
      # Improve performance with overlayfs.
      DOCKER_DRIVER: overlay2
   artifacts:
      paths:
         - 'language-server/taxi-lang-server-standalone/target/taxi-lang-server-jar-with-dependencies.jar'
      reports:
         junit:
            # Note:This won't actually work, b/c of https://gitlab.com/gitlab-org/gitlab-runner/issues/2620
            # However, leaving this here to pick up later
            - "*/target/surefire-reports/TEST-*.xml"


build-ts-codegen-tools-linux:
   stage: build
   image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/vegardit/graalvm-maven:latest-java23
   script:
      # Don't run tests when building native tools
      - 'mvn package -pl taxiql-codegen/taxiql-codegen-cli -am -Pnative -DskipTests'
   artifacts:
      paths:
         - 'taxiql-codegen/taxiql-codegen-cli/target/taxiql-codegen-cli'
   only:
      - tags
      - master
      - develop

