#   rules:
#      - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
#        when: on_success
#      - when: manual
#

.npm-install-sync-pom: &npm-install-sync-pom
   - cd sync-pom-version
   - npm i
   - npm i -g .
   ## Go back from whence we came
   - cd ..

.npm-set-version-and-publish: &npm-set-version-and-publish
   - sync-pom-version -b $CI_PIPELINE_IID
   - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
   - npm publish

publish-codegen-node-windows:
   stage: deploy
   image: node
   dependencies:
      - build-ts-codegen-tools-windows
   script:
      - mkdir -p typescript/taxiql-codegen/packages/win32/bin
      - cp 'taxiql-codegen/taxiql-codegen-cli/target/taxiql-codegen-cli.exe' typescript/taxiql-codegen/packages/win32/bin
      - *npm-install-sync-pom
      - cd typescript/taxiql-codegen/packages/win32
      - *npm-set-version-and-publish

publish-codegen-node-linux:
   stage: deploy
   image: node
   dependencies:
      - build-ts-codegen-tools-linux
   script:
      - mkdir -p typescript/taxiql-codegen/packages/linux/bin
      - cp 'taxiql-codegen/taxiql-codegen-cli/target/taxiql-codegen-cli' typescript/taxiql-codegen/packages/linux/bin/
      - *npm-install-sync-pom
      - cd typescript/taxiql-codegen/packages/linux
      - *npm-set-version-and-publish
   # TODO : Doubt that the linux tool will work on mac, but will give it a go
      #- copy 'taxiql-codegen/taxiql-codegen-cli/target/taxiql-codegen-cli' typescript/taxiql-codegen/packages/darwin

## Manual jobs to trigger a release and increment the version (major,minor,patch)
release-major:
   variables:
      GIT_STRATEGY: none
   stage: trigger-release
   script:
      - *git_setup
      - 'mvn gitflow:release -B -DversionDigitToIncrement=$MAJOR_RELEASE_DIGIT -DskipTestProject=true'
   only:
      - develop
   when: manual

release-minor:
#   variables:
   #      GIT_STRATEGY: none
   stage: trigger-release
   script:
      - *git_setup
      - 'mvn gitflow:release -B -DversionDigitToIncrement=$MINOR_RELEASE_DIGIT  -DskipTestProject=true'
   only:
      - develop
   when: manual

release-patch:
   variables:
      GIT_STRATEGY: none
   stage: trigger-release
   script:
      - *git_setup
      - 'mvn gitflow:release -B -DversionDigitToIncrement=$PATCH_RELEASE_DIGIT  -DskipTestProject=true -P orbital-repo'
   only:
      - develop
   when: manual

## Publishing tasks (snapshots and releases)
publish-snapshot-jars:
   stage: build
   script:
      #      Need gpg for maven signing
      #      - 'apk add gnupg'
      #      - gpg -v --import <(echo "$GPG_PRIVATE_KEY")
      - 'mvn $MAVEN_CLI_OPTS deploy -P snapshot-release,orbital-repo'
   services:
      -  name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:20.10.23-dind
         alias: docker
         command: [ "--tls=false" ]
   variables:
      # Instruct Testcontainers to use the daemon of DinD.
      DOCKER_HOST: "tcp://docker:2375"
      # Instruct Docker not to start over TLS.
      DOCKER_TLS_CERTDIR: ""
      # Improve performance with overlayfs.
      DOCKER_DRIVER: overlay2
   only:
      - develop
   artifacts:
      paths:
         - "taxi-cli/target/*.zip"
         - 'language-server/taxi-lang-server-standalone/target/taxi-lang-server-jar-with-dependencies.jar'

build-plugin-beta:
   stage: build-tools
   script:
      - *setup-nvm
      - *prepare-vscode-plugin-build
      - 'npm run vsce:package'
   only:
      - develop
   after_script:
      - *cleanup-after-vscode-plugin-build
   artifacts:
      paths:
         - 'language-server/vscode-extension/*.vsix'

publish-release:
   stage: deploy
   script:
      # Don't run tests on master, as already passed on develop
      # Use -DskipTests, but not -Dmaven.test.skip=true as we need to compile the tests (as other projects have test dependencies), but not run them.
      - 'mvn $MAVEN_CLI_OPTS -DskipTests deploy -P release,orbital-repo'
      # Use jreleaser to publish to sdkman, and others
      - 'cd taxi-cli'
      - 'mvn deploy -P orbital-repo,sdkman'
   only:
      - master
   artifacts:
      paths:
         - "taxi-cli/target/*.zip"
         - 'language-server/taxi-lang-server-standalone/target/taxi-lang-server-jar-with-dependencies.jar'
         - "taxi-cli/target/jreleaser/*.log"

publish-plugin:
   stage: deploy-plugin
   script:
      - *setup-nvm
      - *prepare-vscode-plugin-build
      - 'npm run vsce:publish'
   only:
      - master
   artifacts:
      paths:
         - 'language-server/vscode-extension/*.vsix'
   after_script:
      - *cleanup-after-vscode-plugin-build



