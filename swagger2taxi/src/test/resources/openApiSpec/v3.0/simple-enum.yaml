openapi: 3.0.0
info:
   title: Sample API with Enum
   description: This API demonstrates the use of enums in OpenAPI.
   version: 1.0.0
paths:
   /pets:
      get:
         summary: Get a list of pets
         responses:
            '200':
               description: A list of pets
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/Pet'
components:
   schemas:
      Pet:
         type: object
         properties:
            id:
               type: string
            name:
               type: string
            type:
               type: string
               enum:
                  - dog
                  - cat
                  - bird
                  - fish
         required:
            - id
            - name
            - type
