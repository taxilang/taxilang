# Complete example taxi.conf file
# This demonstrates all available configuration options

name: org.example/my-project
version: 1.0.0

sourceRoot: src/
output: dist/

# Plugin configuration
plugins: {
   "taxi/kotlin": {
      maven: {
         groupId: "com.example"
         artifactId: "my-project"
         repositories: [
            {
               id: "internal-repo"
               url: "https://nexus.example.com"
               snapshots: true
            }
         ]
      }
   }
   "taxi/open-api": {
   }
}

# Plugin settings
pluginSettings: {
   repositories: ["https://plugins.taxilang.org"]
   localCache: "~/.taxi/plugins"
}

# Package repositories
repositories: [
   {
      url: "https://nexus.example.com/repository/taxi"
      name: "internal-nexus"
      type: "nexus"
      settings: {
         repositoryName: "taxi"
      }
   }
]

# Publish configuration
publishToRepository: {
   url: "https://nexus.example.com/repository/taxi-releases"
   name: "nexus-releases"
   settings: {
      repositoryName: "taxi-releases"
   }
}

# Credentials (not recommended to commit these!)
credentials: [
   {
      repositoryName: "internal-nexus"
      username: "deploy-user"
      password: "${NEXUS_PASSWORD}"
   }
]

# Linter configuration
linter: {
   no-duplicate-types-on-models: {
      enabled: true
      severity: ERROR
   }
   no-primitive-types-on-models: {
      enabled: false
   }
   unused-import: {
      severity: WARNING
   }
}

# Additional sources
additionalSources: {
   "@taxi/originalSources": "**/*.taxi"
   "@orbital/config": "**/*.conf"
}

# Dependencies
dependencies: {
   "org.taxilang/stdlib": "1.0.0"
   "com.example/shared-types": "2.1.0-SNAPSHOT"
}
