name: IntelliJ Plugin Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  build-plugin-beta:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install maven

      - name: Build Maven dependencies
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          mvnd clean install -pl :taxi-lang-service -am -DskipTests

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Build IntelliJ Plugin
        working-directory: language-server/intellij-plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin-beta
          path: language-server/intellij-plugin/build/distributions/*.zip
          retention-days: 30

  publish-plugin:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install maven

      - name: Build Maven dependencies
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          mvnd clean install -pl :taxi-lang-service -am -DskipTests

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5

      - name: Publish to JetBrains Marketplace
        working-directory: language-server/intellij-plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.INTELLIJ_PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin-release
          path: language-server/intellij-plugin/build/distributions/*.zip
          retention-days: 90
